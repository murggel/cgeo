# Settings of the AI workflow. Read and checked by ai/scripts/settings.py;
# a mistake makes the next run fail with an explanation.
#
# Dates and weekdays refer to this time zone.
timezone: Europe/Berlin

snapshot:
  # Days of the month on which the scheduled task renews the issue snapshot.
  days: [1, 15]

cleanup:
  # Issues per cleanup run (or per batch), if a request does not set count. 1 to 30.
  count: 20
  # Issues checked by a cleanup run are skipped for this many days,
  # unless they have had activity since.
  skip_days: 183
  # "Waiting for information" needs an unanswered question to the reporter
  # that is at least this many months old.
  waiting_months: 6

  # Plan for requests with "provider: auto", which the scheduled task pushes
  # every night. The first rule that matches the night is used; if none
  # matches, no cleanup request is pushed.
  #   days:        days of the month, e.g. 1-20 or [1, 2, 3]
  #   weekdays:    mon, tue, wed, thu, fri, sat, sun (leave out: every day)
  #   provider:    claude or copilot
  #   count:       issues per run or batch (leave out: count above)
  #   max_batches: copilot only: up to this many batches in one night, as far
  #                as the Copilot AI Credits below allow (leave out: 1)
  auto:
    # Friday 3:00 suits Claude: the weekly limit resets on Friday at 5:00.
    - days: 1-20
      weekdays: [fri]
      provider: claude
    - days: 1-20
      weekdays: [tue]
      provider: copilot
    # Absence 26.11.-1.12.2026: the Claude limit is unused on these nights.
    # The night of the 26th stays with Copilot for the lowered reserve.
    # Remove this rule after the trip.
    - days: [27, 28, 29, 30]
      provider: claude
      count: 30
    # Unused AI Credits expire at the end of the month, so they go to the cleanup.
    - days: 21-31
      provider: copilot
      max_batches: 5

copilot:
  # GitHub AI Credits included per month. Since June 2026 Copilot is billed
  # by tokens in AI Credits instead of premium requests.
  monthly_credits: 1500
  # AI Credits one cleanup batch costs, an estimate. The report header shows
  # the credits used before each run; compare consecutive reports to measure it.
  cost_per_batch: 100
  # AI Credits that must stay free for your own work. A Copilot run of the
  # plan above only starts if enough is left beyond this reserve.
  reserve: 300
  # Model for cleanup-issues runs with Copilot (empty: Copilot's default).
  # A cheaper model uses fewer AI Credits per batch.
  cleanup_model: claude-haiku-5.5
