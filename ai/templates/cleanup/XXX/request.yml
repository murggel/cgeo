# Copy this template to ai/requests/cleanup/<name>/request.yml, e.g. ai/requests/cleanup/2026-11-15/request.yml.
# Checks open cgeo/cgeo issues from the issue snapshot and recommends which ones can be closed.
# The report goes to report.md in this folder (report-2.md, ... for further batches), the results
# to ai/issues/cleanup.json, the overview of all reports to ai/issues/cleanup.md.
task: cleanup-issues
# auto: provider, number of issues and batches follow ai/settings.yml and the Copilot quota
# (the scheduled task uses this); claude or copilot: one run with that provider.
provider: copilot # auto, claude
# Optional: number of issues to check (default from ai/settings.yml, at most 30).
# count: 20
# Optional: only issues with at least one of these labels.
# labels: [Bug, Unverified]
# Optional: additional instructions (max. 4000 characters).
# instructions: |
#   Be strict with "fixed".
