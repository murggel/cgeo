name: AI request

on:
  push:
    branches:
      - dev/ai-workflows
    paths:
      - 'ai/requests/**/request.yml'

permissions: {}

concurrency:
  group: ai-request-${{ github.ref }}
  cancel-in-progress: false
  queue: max

defaults:
  run:
    # bash -eo pipefail for all steps
    shell: bash

env:
  COPILOT_CLI_VERSION: '1.0.105'
  # 'auto' lets Copilot choose a model with a 0x to 1x multiplier.
  # Alternative fixed model that is included on paid plans: 'gpt-5-mini'
  SMOKE_TEST_MODEL: 'auto'
  MAX_REPORT_BYTES: '524288'

jobs:
  validate:
    name: Validate request
    if: github.actor == 'murggel' && github.ref == 'refs/heads/dev/ai-workflows'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      request_dir: ${{ steps.request.outputs.request_dir }}
      task: ${{ steps.request.outputs.task }}
      # For cleanup-issues the provider comes from ai/settings.yml (empty: skip the run).
      provider: ${{ steps.resolve.outputs.provider }}
      number: ${{ steps.request.outputs.number }}
      repository: ${{ steps.request.outputs.repository }}
      instructions: ${{ steps.request.outputs.instructions }}
      branch: ${{ steps.request.outputs.branch }}
      base: ${{ steps.request.outputs.base }}
      previous_report: ${{ steps.request.outputs.previous_report }}
      verify: ${{ steps.request.outputs.verify }}
      verify_target: ${{ steps.request.outputs.verify_target }}
      preselect: ${{ steps.request.outputs.preselect }}
      count: ${{ steps.resolve.outputs.count }}
      labels: ${{ steps.request.outputs.labels }}
      batches: ${{ steps.resolve.outputs.batches }}
      skip_days: ${{ steps.resolve.outputs.skip_days }}
      waiting_months: ${{ steps.resolve.outputs.waiting_months }}
      # Copilot: model of cleanup-issues runs (empty: default) and the AI Credits before the run.
      model: ${{ steps.resolve.outputs.model }}
      credits: ${{ steps.resolve.outputs.credits }}

    steps:
      - name: Check out request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          # Two commits are enough for the "pushed commit only" fallback.
          fetch-depth: 2
          sparse-checkout: /ai/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check --no-input --require-hashes --requirement ai/scripts/requirements.txt

      - name: Run script tests
        run: python -m unittest discover --start-directory ai/scripts --pattern 'test_*.py' --verbose

      - name: Find and validate the pushed request
        id: request
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          # Messages of all pushed commits, for the issue reference check.
          PUSHED_COMMITS: ${{ toJSON(github.event.commits) }}
        run: |
          request_file="(unknown)"

          fail() {
            local msg="$1"
            {
              echo "## AI request validation failed"
              echo
              echo "- Request: $request_file"
              echo
              printf '%s\n' "$msg"
            } >> "$GITHUB_STEP_SUMMARY"
            msg="${msg//'%'/'%25'}"
            msg="${msg//$'\r'/'%0D'}"
            msg="${msg//$'\n'/'%0A'}"
            echo "::error::$msg"
            exit 1
          }

          # Compare with the state before the push. If it is unavailable
          # (first push, force push), look only at the pushed commit.
          zero_sha="0000000000000000000000000000000000000000"
          if [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "$zero_sha" ]] \
              && git fetch --quiet --no-tags --depth=1 origin "$BEFORE_SHA" 2>/dev/null; then
            base="$BEFORE_SHA"
          else
            echo "::notice::Base commit unavailable; looking only at the pushed commit."
            base="$AFTER_SHA^"
          fi

          # Only added and modified requests count; moved (R) and
          # deleted (D) requests do not start a run.
          diff_output=$(git diff --name-only --diff-filter=AM "$base" "$AFTER_SHA" -- 'ai/requests/**/request.yml') \
            || fail "git diff between $base and $AFTER_SHA failed."

          request_files=()
          if [[ -n "$diff_output" ]]; then
            mapfile -t request_files <<< "$diff_output"
          fi
          if [[ "${#request_files[@]}" -eq 0 ]]; then
            echo "::notice::No added or modified request.yml in this push (only moved or deleted requests); nothing to do."
            printf '## Nothing to do\n\nThis push only moved or deleted requests.\n' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "${#request_files[@]}" -ne 1 ]]; then
            fail "Expected exactly one added or modified request.yml under ai/requests/ in this push; found ${#request_files[@]}: ${request_files[*]}"
          fi
          request_file="${request_files[0]}"

          # GitHub has already linked a referencing commit to the issue or pull
          # request in cgeo/cgeo; failing here cannot undo that, but makes it visible.
          commit_messages=()
          while IFS= read -r -d '' commit_message; do
            commit_messages+=("$commit_message")
          done < <(jq -j '.[].message + "\u0000"' <<< "$PUSHED_COMMITS")
          if [[ "${#commit_messages[@]}" -gt 0 ]] \
              && ! result=$(python ai/scripts/check_commit_message.py -- "${commit_messages[@]}" 2>&1); then
            fail "$result"
          fi

          if ! result=$(python ai/scripts/validate_request.py "$request_file" --github-output "$GITHUB_OUTPUT" 2>&1); then
            fail "$result"
          fi
          printf '## AI request validated\n\n%s\n' "$result" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve provider and cleanup settings
        id: resolve
        if: steps.request.outputs.task != ''
        env:
          TASK: ${{ steps.request.outputs.task }}
          PROVIDER: ${{ steps.request.outputs.provider }}
          COUNT: ${{ steps.request.outputs.count }}
          EXTRA: ${{ steps.request.outputs.extra }}
          # Read-only access to the owner's billing data, only for the Copilot AI Credits.
          COPILOT_BILLING_TOKEN: ${{ secrets.COPILOT_BILLING_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [[ "$TASK" != "cleanup-issues" ]]; then
            echo "provider=$PROVIDER" >> "$GITHUB_OUTPUT"
            # Only for the report header; an unknown state does not stop the run.
            if [[ "$PROVIDER" == "copilot" ]]; then
              python ai/scripts/settings.py credits --user "$OWNER" --github-output "$GITHUB_OUTPUT" \
                || echo "::warning::AI Credits could not be read."
            fi
            exit 0
          fi
          if ! result=$(python ai/scripts/settings.py resolve --provider "$PROVIDER" --count "$COUNT" \
              --extra "$EXTRA" --user "$OWNER" --github-output "$GITHUB_OUTPUT" 2>&1); then
            echo "::error::$result"
            exit 1
          fi
          printf '## Cleanup plan\n\n%s\n' "$result" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::$result"

  run-copilot:
    name: Run ${{ needs.validate.outputs.task }}${{ needs.validate.outputs.number && format(' {0}#{1}', needs.validate.outputs.repository, needs.validate.outputs.number) || '' }}${{ needs.validate.outputs.branch && format(' {0}', needs.validate.outputs.branch) || '' }} with GitHub Copilot
    needs: validate
    if: needs.validate.outputs.provider == 'copilot'
    runs-on: ubuntu-24.04
    # Cleanup requests may run several batches.
    timeout-minutes: 90
    outputs:
      # cleanup-issues: the issues this run checked, for recording the results.
      candidates: ${{ steps.prepare.outputs.candidates }}
    permissions:
      contents: read
      issues: read
    env:
      TASK: ${{ needs.validate.outputs.task }}

    steps:
      - name: Check out request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: /ai/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install GitHub Copilot CLI
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          if [[ -z "$COPILOT_GITHUB_TOKEN" ]]; then
            echo "::error::Repository secret COPILOT_GITHUB_TOKEN is missing."
            exit 1
          fi
          npm install --global --no-audit --no-fund "@github/copilot@${COPILOT_CLI_VERSION}"
          installed="$(copilot --version | head -n1)"
          if [[ "$installed" != *"$COPILOT_CLI_VERSION"* ]]; then
            echo "::error::Expected Copilot CLI $COPILOT_CLI_VERSION, got: $installed"
            exit 1
          fi

      - name: Prepare workspace
        id: prepare
        env:
          GH_API_TOKEN: ${{ github.token }}
          NUMBER: ${{ needs.validate.outputs.number }}
          REPOSITORY: ${{ needs.validate.outputs.repository }}
          # Passed through the environment, never inlined into the script.
          INSTRUCTIONS: ${{ needs.validate.outputs.instructions }}
          REVIEW_BRANCH: ${{ needs.validate.outputs.branch }}
          REVIEW_BASE: ${{ needs.validate.outputs.base }}
          PREVIOUS_REPORT: ${{ needs.validate.outputs.previous_report }}
          VERIFY: ${{ needs.validate.outputs.verify }}
          VERIFY_TARGET: ${{ needs.validate.outputs.verify_target }}
          PRESELECT: ${{ needs.validate.outputs.preselect }}
          COUNT: ${{ needs.validate.outputs.count }}
          LABELS: ${{ needs.validate.outputs.labels }}
          BATCHES: ${{ needs.validate.outputs.batches }}
          SKIP_DAYS: ${{ needs.validate.outputs.skip_days }}
          WAITING_MONTHS: ${{ needs.validate.outputs.waiting_months }}
        run: |
          python ai/scripts/prepare_task.py --task "$TASK" --number "$NUMBER" --repository "$REPOSITORY" \
            --instructions="$INSTRUCTIONS" --branch="$REVIEW_BRANCH" --base="$REVIEW_BASE" \
            --previous-report="$PREVIOUS_REPORT" --issue-snapshot ai/issues \
            --verify="$VERIFY" --verify-target="$VERIFY_TARGET" --preselect="$PRESELECT" \
            --count="$COUNT" --labels="$LABELS" --batches="$BATCHES" \
            --skip-days="$SKIP_DAYS" --waiting-months="$WAITING_MONTHS" \
            --output-dir "$RUNNER_TEMP" --github-output "$GITHUB_OUTPUT"

      - name: Run Copilot
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          PROMPT_FILE: ${{ steps.prepare.outputs.prompt_file }}
          # cleanup-issues: one prompt per batch; otherwise empty.
          PROMPT_FILES: ${{ steps.prepare.outputs.prompt_files }}
          CLEANUP_MODEL: ${{ needs.validate.outputs.model }}
        run: |
          model_args=()
          if [[ "$TASK" == "smoke-test" ]]; then
            model_args=(--model="$SMOKE_TEST_MODEL")
          elif [[ "$TASK" == "cleanup-issues" && -n "$CLEANUP_MODEL" ]]; then
            model_args=(--model="$CLEANUP_MODEL")
          fi
          read -ra prompts <<< "${PROMPT_FILES:-$PROMPT_FILE}"
          for index in "${!prompts[@]}"; do
            suffix=""
            (( index > 0 )) && suffix="-$((index + 1))"
            copilot -p "$(cat "${prompts[$index]}")" "${model_args[@]}" \
              --add-dir "$GITHUB_WORKSPACE" \
              --available-tools='view,grep,glob' \
              --deny-tool='write' \
              --deny-tool='shell' \
              --deny-tool='url' \
              --no-ask-user \
              --secret-env-vars COPILOT_GITHUB_TOKEN \
              -s > "$RUNNER_TEMP/response$suffix.md"
          done

      - name: Create report
        env:
          HEADER: ${{ steps.prepare.outputs.header }}
          APPENDIX: ${{ steps.prepare.outputs.appendix }}
          CANDIDATES: ${{ steps.prepare.outputs.candidates }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          CLEANUP_MODEL: ${{ needs.validate.outputs.model }}
          CREDITS: ${{ needs.validate.outputs.credits }}
        run: |
          model=""
          if [[ "$TASK" == "smoke-test" ]]; then
            model=" | model: $SMOKE_TEST_MODEL"
          elif [[ "$TASK" == "cleanup-issues" && -n "$CLEANUP_MODEL" ]]; then
            model=" | model: $CLEANUP_MODEL"
          fi
          credits=" | AI credits before run: ${CREDITS:-unknown}"
          read -ra batches <<< "${CANDIDATES//;/ }"
          total=${#batches[@]}
          for response in "$RUNNER_TEMP"/response*.md; do
            name=$(basename "$response")
            suffix=${name#response}
            suffix=${suffix%.md}
            batch=""
            if (( total > 1 )); then
              number=${suffix#-}
              batch=" | batch: ${number:-1}/$total"
            fi
            python ai/scripts/finalize_report.py \
              --copilot-output "$response" \
              ${APPENDIX:+--append "$APPENDIX"} \
              --header "$HEADER$batch | provider: copilot ${COPILOT_CLI_VERSION}${model}${credits} | workflow: ${GITHUB_SHA}" \
              --secret-env COPILOT_GITHUB_TOKEN --secret-env GITHUB_TOKEN \
              --output "$RUNNER_TEMP/report$suffix.md"
          done

      - name: Find fixing pull requests
        # cleanup-issues: replaces the fix-evidence block and the [fix-pr #n] placeholders.
        if: env.TASK == 'cleanup-issues'
        env:
          GH_API_TOKEN: ${{ github.token }}
          CANDIDATES: ${{ steps.prepare.outputs.candidates }}
        run: |
          read -ra batches <<< "${CANDIDATES//;/ }"
          for index in "${!batches[@]}"; do
            suffix=""
            (( index > 0 )) && suffix="-$((index + 1))"
            report="$RUNNER_TEMP/report$suffix.md"
            [[ -f "$report" && ! -L "$report" ]] || continue
            python ai/scripts/fix_history.py --report "$report" --upstream upstream \
              --issues ai/issues --checked "${batches[$index]}" \
              || echo "::warning::Pull requests for $(basename "$report") could not be looked up."
          done

      - name: Upload report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report
          path: ${{ runner.temp }}/report*.md
          if-no-files-found: error
          retention-days: 3

  run-claude:
    name: Run ${{ needs.validate.outputs.task }}${{ needs.validate.outputs.number && format(' {0}#{1}', needs.validate.outputs.repository, needs.validate.outputs.number) || '' }}${{ needs.validate.outputs.branch && format(' {0}', needs.validate.outputs.branch) || '' }} with Claude Code
    needs: validate
    if: needs.validate.outputs.provider == 'claude'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      # cleanup-issues: the issues this run checked, for recording the results.
      candidates: ${{ steps.prepare.outputs.candidates }}
    permissions:
      contents: read
      issues: read
    env:
      TASK: ${{ needs.validate.outputs.task }}

    steps:
      - name: Check out request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: /ai/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Check Claude authentication secret
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [[ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]]; then
            echo "::error::Repository secret CLAUDE_CODE_OAUTH_TOKEN is missing."
            exit 1
          fi

      - name: Prepare workspace
        id: prepare
        env:
          GH_API_TOKEN: ${{ github.token }}
          NUMBER: ${{ needs.validate.outputs.number }}
          REPOSITORY: ${{ needs.validate.outputs.repository }}
          # Passed through the environment, never inlined into the script.
          INSTRUCTIONS: ${{ needs.validate.outputs.instructions }}
          REVIEW_BRANCH: ${{ needs.validate.outputs.branch }}
          REVIEW_BASE: ${{ needs.validate.outputs.base }}
          PREVIOUS_REPORT: ${{ needs.validate.outputs.previous_report }}
          VERIFY: ${{ needs.validate.outputs.verify }}
          VERIFY_TARGET: ${{ needs.validate.outputs.verify_target }}
          PRESELECT: ${{ needs.validate.outputs.preselect }}
          COUNT: ${{ needs.validate.outputs.count }}
          LABELS: ${{ needs.validate.outputs.labels }}
          BATCHES: ${{ needs.validate.outputs.batches }}
          SKIP_DAYS: ${{ needs.validate.outputs.skip_days }}
          WAITING_MONTHS: ${{ needs.validate.outputs.waiting_months }}
        run: |
          python ai/scripts/prepare_task.py --task "$TASK" --number "$NUMBER" --repository "$REPOSITORY" \
            --instructions="$INSTRUCTIONS" --branch="$REVIEW_BRANCH" --base="$REVIEW_BASE" \
            --previous-report="$PREVIOUS_REPORT" --issue-snapshot ai/issues \
            --verify="$VERIFY" --verify-target="$VERIFY_TARGET" --preselect="$PRESELECT" \
            --count="$COUNT" --labels="$LABELS" --batches="$BATCHES" \
            --skip-days="$SKIP_DAYS" --waiting-months="$WAITING_MONTHS" \
            --output-dir "$RUNNER_TEMP" --github-output "$GITHUB_OUTPUT"

      - name: Run Claude Code
        id: claude
        # The action fails runs that exceed --max-turns even when Claude
        # finished; finalize_report.py decides whether the result is usable.
        continue-on-error: true
        uses: anthropics/claude-code-action/base-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1.0.268
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Task prompt plus the request's additional instructions, if any.
          prompt_file: ${{ steps.prepare.outputs.prompt_file }}
          # Read-only tools; /proc is blocked so environment variables cannot be read.
          claude_args: >-
            --tools Read,Glob,Grep
            --disallowedTools "Bash,Edit,Write,NotebookEdit,WebFetch,WebSearch,Read(//proc/**)"
            --setting-sources user
            --max-turns ${{ steps.prepare.outputs.max_turns }}
          show_full_output: 'false'

      - name: Create report
        env:
          HEADER: ${{ steps.prepare.outputs.header }}
          APPENDIX: ${{ steps.prepare.outputs.appendix }}
          # The output is missing when the action failed; the file is still written.
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file || format('{0}/claude-execution-output.json', runner.temp) }}
          MAX_TURNS: ${{ steps.prepare.outputs.max_turns }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python ai/scripts/finalize_report.py \
            --claude-execution-file "$EXECUTION_FILE" --max-turns "$MAX_TURNS" \
            ${APPENDIX:+--append "$APPENDIX"} \
            --header "$HEADER | provider: claude | workflow: ${GITHUB_SHA}" \
            --secret-env CLAUDE_CODE_OAUTH_TOKEN --secret-env GITHUB_TOKEN \
            --output "$RUNNER_TEMP/report.md"

      - name: Find fixing pull requests
        # cleanup-issues: replaces the fix-evidence block and the [fix-pr #n] placeholders.
        if: env.TASK == 'cleanup-issues'
        env:
          GH_API_TOKEN: ${{ github.token }}
          CANDIDATES: ${{ steps.prepare.outputs.candidates }}
        run: |
          read -ra batches <<< "${CANDIDATES//;/ }"
          for index in "${!batches[@]}"; do
            suffix=""
            (( index > 0 )) && suffix="-$((index + 1))"
            report="$RUNNER_TEMP/report$suffix.md"
            [[ -f "$report" && ! -L "$report" ]] || continue
            python ai/scripts/fix_history.py --report "$report" --upstream upstream \
              --issues ai/issues --checked "${batches[$index]}" \
              || echo "::warning::Pull requests for $(basename "$report") could not be looked up."
          done

      - name: Upload report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report
          path: ${{ runner.temp }}/report*.md
          if-no-files-found: error
          retention-days: 3

  publish-report:
    name: Commit report${{ needs.validate.outputs.number && format(' {0}#{1}', needs.validate.outputs.repository, needs.validate.outputs.number) || '' }}${{ needs.validate.outputs.branch && format(' {0}', needs.validate.outputs.branch) || '' }}
    needs:
      - validate
      - run-copilot
      - run-claude
    # Exactly one provider job runs; the other one is skipped.
    if: >-
      always() && needs.validate.result == 'success' && needs.validate.outputs.provider != '' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      BRANCH: dev/ai-workflows
      REQUEST_DIR: ${{ needs.validate.outputs.request_dir }}
      TASK: ${{ needs.validate.outputs.task }}
      PROVIDER: ${{ needs.validate.outputs.provider }}
      NUMBER: ${{ needs.validate.outputs.number }}
      REVIEW_BRANCH: ${{ needs.validate.outputs.branch }}
      CANDIDATES: ${{ needs.run-copilot.outputs.candidates || needs.run-claude.outputs.candidates }}

    steps:
      - name: Check out request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: /ai/
          sparse-checkout-cone-mode: false
          persist-credentials: true

      - name: Download report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: report
          path: ${{ runner.temp }}/report

      - name: Commit and push report
        run: |
          # report.md, and for cleanup batches report-2.md, report-3.md, ...
          read -ra checked <<< "${CANDIDATES//;/ }"
          sources=("$RUNNER_TEMP/report/report.md")
          for (( batch = 2; batch <= ${#checked[@]}; batch++ )); do
            sources+=("$RUNNER_TEMP/report/report-$batch.md")
          done
          for source in "${sources[@]}"; do
            if [[ -L "$source" || ! -f "$source" ]]; then
              echo "::error::Downloaded report $(basename "$source") is missing or not a regular file."
              exit 1
            fi
            if (( $(wc -c < "$source") > MAX_REPORT_BYTES )); then
              echo "::error::Report $(basename "$source") exceeds the 512 KiB limit."
              exit 1
            fi
          done

          case "$TASK" in
            analyze-issue) message="Add ${PROVIDER^} analysis report for issue-$NUMBER" ;;
            review-pr) message="Add ${PROVIDER^} review report for pr-$NUMBER" ;;
            review-branch) message="Add ${PROVIDER^} review report for branch $REVIEW_BRANCH" ;;
            verify-issues) message="Add ${PROVIDER^} issue verification for $(basename "$(dirname "$REQUEST_DIR")")" ;;
            cleanup-issues) message="Add ${PROVIDER^} issue cleanup report ${REQUEST_DIR##*/}" ;;
            *) message="Add ${PROVIDER^} smoke-test report" ;;
          esac
          if ! python3 ai/scripts/check_commit_message.py -- "$message"; then
            echo "::error::The report commit message would reference an issue or pull request in cgeo/cgeo. The report is still available as the 'report' artifact."
            exit 1
          fi
          # Cleanup runs write one report per batch into the request folder; their results go
          # to ai/issues/cleanup.json and the overview of all reports to ai/issues/cleanup.md.
          report_paths=("$REQUEST_DIR/report.md")
          for (( batch = 2; batch <= ${#checked[@]}; batch++ )); do
            report_paths+=("$REQUEST_DIR/report-$batch.md")
          done
          cleanup_index=ai/issues/cleanup.md
          cleanup_compare=ai/issues/cleanup-compare.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Always build on the latest branch state; retry up to three
          # times if someone pushes in between.
          for attempt in 1 2 3; do
            git fetch --quiet --no-tags --depth=1 origin "$BRANCH"
            git checkout --quiet --force -B publish FETCH_HEAD

            # No path component may be a symlink; otherwise the bot
            # could write outside the request directory.
            for report_path in "${report_paths[@]}" ai/issues/cleanup.json "$cleanup_index" "$cleanup_compare"; do
              IFS=/ read -ra parts <<< "$report_path"
              path=""
              for part in "${parts[@]}"; do
                path="${path:+$path/}$part"
                if [[ -L "$path" ]]; then
                  echo "::error::$path is a symbolic link; refusing to write the report."
                  exit 1
                fi
              done
            done
            if [[ ! -d "$REQUEST_DIR" ]]; then
              echo "::error::$REQUEST_DIR no longer exists on $BRANCH. The report is still available as the 'report' artifact."
              exit 1
            fi

            for index in "${!report_paths[@]}"; do
              report_path="${report_paths[$index]}"
              mkdir -p -- "${report_path%/*}"
              cp "${sources[$index]}" "$report_path"
              git add -- "$report_path"
              if [[ "$TASK" == "cleanup-issues" ]]; then
                # A missing or broken result block keeps the report but records nothing.
                if python3 ai/scripts/issue_cleanup.py apply --report "$report_path" --issues ai/issues \
                    --checked "${checked[$index]}" --date "$(date -u +%F)"; then
                  git add -- ai/issues/cleanup.json
                else
                  echo "::warning::Cleanup results of $report_path were not recorded; see the report."
                fi
              fi
            done
            if [[ "$TASK" == "cleanup-issues" ]]; then
              if python3 ai/scripts/issue_cleanup.py index --requests ai/requests/cleanup \
                  --index "$cleanup_index" --compare "$cleanup_compare" --issues ai/issues; then
                git add -- "$cleanup_index" "$cleanup_compare"
              else
                echo "::warning::The overview $cleanup_index could not be updated."
              fi
            fi
            if git diff --cached --quiet; then
              echo "The report is unchanged; no commit is needed."
              exit 0
            fi
            git commit --quiet -m "$message"

            if git push --quiet origin "HEAD:$BRANCH"; then
              printf '## Report committed\n\n' >> "$GITHUB_STEP_SUMMARY"
              printf -- '- Report: %s\n' "${report_paths[@]}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::warning::Push attempt $attempt failed; retrying."
            sleep $((attempt * 3))
          done

          echo "::error::Could not push the report after 3 attempts. It is still available for 3 days as the 'report' artifact."
          exit 1

  refresh-issues:
    name: Create issue snapshot of cgeo/cgeo
    needs: validate
    if: needs.validate.outputs.task == 'refresh-issues'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Runs no AI; it only reads public issues and commits the summary.
    permissions:
      contents: write
      issues: read
    env:
      BRANCH: dev/ai-workflows
      REQUEST_DIR: ${{ needs.validate.outputs.request_dir }}
      REPOSITORY: ${{ needs.validate.outputs.repository }}

    steps:
      - name: Check out request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: /ai/
          sparse-checkout-cone-mode: false
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Create snapshot
        env:
          GH_API_TOKEN: ${{ github.token }}
        run: |
          cleanup_args=()
          if [[ -f ai/issues/cleanup.json && ! -L ai/issues/cleanup.json ]]; then
            cleanup_args=(--cleanup-state ai/issues/cleanup.json)
          fi
          python ai/scripts/issue_snapshot.py --repository "$REPOSITORY" \
            --directory "$RUNNER_TEMP/issues" --report "$RUNNER_TEMP/report.md" "${cleanup_args[@]}"
          if (( $(du -cb "$RUNNER_TEMP/issues"/* | tail -n1 | cut -f1) > 4 * 1024 * 1024 )); then
            echo "::error::Issue snapshot exceeds 4 MiB."
            exit 1
          fi

      - name: Commit and push snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          snapshot_dir="ai/issues"
          report_path="$REQUEST_DIR/report.md"

          # Always build on the latest branch state; retry up to three
          # times if someone pushes in between.
          for attempt in 1 2 3; do
            git fetch --quiet --no-tags --depth=1 origin "$BRANCH"
            git checkout --quiet --force -B publish FETCH_HEAD

            for path in ai "$snapshot_dir" "$(dirname "$REQUEST_DIR")" "$REQUEST_DIR" "$report_path"; do
              if [[ -L "$path" ]]; then
                echo "::error::$path is a symbolic link; refusing to write."
                exit 1
              fi
            done
            if [[ ! -d "$REQUEST_DIR" ]]; then
              echo "::error::$REQUEST_DIR no longer exists on $BRANCH."
              exit 1
            fi

            # Only the snapshot files are replaced; cleanup results and reports stay.
            for file in issues.md snapshot.json; do
              if [[ -L "$snapshot_dir/$file" ]]; then
                echo "::error::$snapshot_dir/$file is a symbolic link; refusing to write."
                exit 1
              fi
            done
            mkdir -p -- "$snapshot_dir"
            cp -- "$RUNNER_TEMP/issues/issues.md" "$RUNNER_TEMP/issues/snapshot.json" "$snapshot_dir"/
            cp -- "$RUNNER_TEMP/report.md" "$report_path"
            git add -- "$snapshot_dir/issues.md" "$snapshot_dir/snapshot.json" "$report_path"
            # The overview leaves out issues that are no longer open in the new snapshot.
            if [[ -L "$snapshot_dir/cleanup.md" || -L "$snapshot_dir/cleanup-compare.md" ]]; then
              echo "::warning::The cleanup overview is a symbolic link; it is not updated."
            elif python3 ai/scripts/issue_cleanup.py index --requests ai/requests/cleanup \
                --index "$snapshot_dir/cleanup.md" --compare "$snapshot_dir/cleanup-compare.md" \
                --issues "$snapshot_dir"; then
              git add -- "$snapshot_dir/cleanup.md" "$snapshot_dir/cleanup-compare.md"
            else
              echo "::warning::The overview $snapshot_dir/cleanup.md could not be updated."
            fi
            if git diff --cached --quiet; then
              echo "The snapshot is unchanged; no commit is needed."
              exit 0
            fi
            git commit --quiet -m "Update issue snapshot of $REPOSITORY"

            if git push --quiet origin "HEAD:$BRANCH"; then
              printf '## Issue snapshot committed\n\n%s\n' "$(tail -n1 "$RUNNER_TEMP/report.md")" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::warning::Push attempt $attempt failed; retrying."
            sleep $((attempt * 3))
          done

          echo "::error::Could not push the issue snapshot after 3 attempts."
          exit 1
