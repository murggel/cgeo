name: AI request

on:
  push:
    branches:
      - dev/ai-workflows
    paths:
      - 'ai/requests/**/request.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate request
    if: github.actor == 'murggel' && github.ref == 'refs/heads/dev/ai-workflows'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validator dependencies
        run: python -m pip install --requirement ai/scripts/requirements.txt

      - name: Run validator tests
        run: python -m unittest discover --start-directory ai/scripts --pattern 'test_*.py' --verbose

      - name: Find and validate the committed request
        id: request
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t request_files < <(
            git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" -- 'ai/requests/**/request.yml'
          )

          write_failure_summary() {
            {
              echo "## AI request validation failed"
              echo
              echo "- Request: \`$request_file\`"
              echo
              echo "**Error**"
              echo
              printf '%s\\n' "$1"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          if [[ "${#request_files[@]}" -ne 1 ]]; then
            request_file="Could not identify a single request file"
            error="Expected exactly one changed ai/requests/<task-id>/request.yml file in this push; found ${#request_files[@]}."
            echo "::error::$error"
            write_failure_summary "$error"
            exit 1
          fi

          request_file="${request_files[0]}"
          if [[ ! -f "$request_file" ]]; then
            error="The request file was deleted or is not present in the pushed commit."
            echo "::error::$error"
            write_failure_summary "$error"
            exit 1
          fi

          if ! validation_output=$(python ai/scripts/validate_request.py "$request_file" 2>&1); then
            echo "::error::$validation_output"
            write_failure_summary "$validation_output"
            exit 1
          fi

          python - "$request_file" "$GITHUB_OUTPUT" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "ai/scripts")
          from validate_request import validate_request

          request_file = Path(sys.argv[1])
          task, provider, issue = validate_request(request_file)
          output = Path(sys.argv[2])
          with output.open("a", encoding="utf-8") as stream:
              stream.write(f"request_file={request_file.as_posix()}\n")
              stream.write(f"request_dir={request_file.parent.as_posix()}\n")
              stream.write(f"task={task}\n")
              stream.write(f"provider={provider}\n")
              stream.write(f"issue={issue}\n")
          PY

      - name: Summarize validation
        env:
          TASK: ${{ steps.request.outputs.task }}
          PROVIDER: ${{ steps.request.outputs.provider }}
          ISSUE: ${{ steps.request.outputs.issue }}
          REQUEST_FILE: ${{ steps.request.outputs.request_file }}
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "## AI request validated"
            echo
            echo "- Task: \`$TASK\`"
            echo "- Provider: \`$PROVIDER\`"
            echo "- Issue: #\`$ISSUE\`"
            echo "- Request: \`$REQUEST_FILE\`"
            echo
            echo "The request passed schema validation. Provider execution and report creation will be added as the next step."
          } >> "$GITHUB_STEP_SUMMARY"
